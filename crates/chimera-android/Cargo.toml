[package]
name = "chimera-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
chimera = { path = "../chimera" }
chimera-wasm = { path = "../chimera-wasm" }
jni = "0.21.1"
serde_json = { version = "1", features = ["float_roundtrip"] }
